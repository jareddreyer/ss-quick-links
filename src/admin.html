<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8">
    <script type="application/javascript" src="browser-polyfill.min.js"></script>
    <link rel="stylesheet" href="admin.css"/>
    <title></title>
</head>
<body>
    <div class="status-bar">LIVE</div>

    <div class="panel">
        <div class="panel__content">
            <div class="new-window">
                Open all links in new window/tab?
                <label class="switch">
                    <input type="checkbox" id="tabOption">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="panel__group-label">DEVELOPER TOOLS</div>
            <a id="admin-run-devbuild" class="admin-btn">Run /dev/build</a>
            <a id="admin-goto-devtasks" class="admin-btn">Open /dev/tasks</a>
            <a id="admin-goto-dev" class="admin-btn">Open /dev</a>

            <div class="panel-section-separator"></div>

            <div class="panel__group-label">ENVIRONMENT</div>
            <a id="admin-change-stage" class="admin-btn">Change Stage</a>
            <a id="admin-change-environment" class="admin-btn">Change Environment</a>
            <a id="admin-flush-cache-page" class="admin-btn">Flush cache</a>

            <div class="panel-section-separator"></div>
            <div class="panel__group-label">ADMIN TOOLS</div>
            <a id="admin-goto-admin" class="admin-btn admin-btn--primary">Open /admin</a>
            <a id="admin-logout" class="admin-btn admin-btn--primary">Logout</a>
            <a id="admin-back-to-home" class="admin-btn admin-btn--primary">Back to home</a>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
